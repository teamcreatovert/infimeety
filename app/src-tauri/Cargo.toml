[package]
name = "infimeety"
version = "0.7.3"
description = "Infimeety — unlimited voice rooms, chat and watch-together"
edition = "2021"

[lib]
name = "infimeety_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The desktop app only: the tray, updates, one window at a time, and files shared from disk.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Push to talk while a game is in front: reads key state system-wide, like Discord.
device_query = "4"
tauri-plugin-notification = "2"
mime_guess = "2"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panic in a background thread (a device, the overlay) ends that thread, not the whole app.
panic = "unwind"
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8"
wasapi = "0.26.0"
webview2-com = "0.39"
# Native screen sharing (screen_share.rs): Windows.Graphics.Capture, like Discord and OBS.
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Threading",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }
