<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Infimeety</title>
    <meta name="description" content="Voice rooms, chat, meetings and watch-together with your friends. No time limits." />
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      :root { --bg: #08080c; --fg: rgba(255, 255, 255, 0.94); --fg2: rgba(235, 235, 245, 0.64); --fill: rgba(255, 255, 255, 0.08); --hair: rgba(255, 255, 255, 0.12); color-scheme: dark; }
      @media (prefers-color-scheme: light) { :root { --bg: #e9ebf1; --fg: rgba(0, 0, 0, 0.88); --fg2: rgba(60, 60, 67, 0.72); --fill: rgba(0, 0, 0, 0.05); --hair: rgba(0, 0, 0, 0.08); color-scheme: light; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI Variable Display', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wall { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
      .wall span { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.5; }
      .wall span:nth-child(1) { width: 62vw; height: 62vw; left: -14vw; top: -26vw; background: #3a5bff; }
      .wall span:nth-child(2) { width: 54vw; height: 54vw; right: -16vw; bottom: -24vw; background: #8f3dff; }
      img { width: 104px; height: 104px; filter: drop-shadow(0 18px 30px rgba(90, 80, 255, 0.45)); }
      h1 { margin: 18px 0 8px; font-size: 40px; font-weight: 700; letter-spacing: -0.04em; }
      p { margin: 0 auto; max-width: 420px; color: var(--fg2); font-size: 16px; line-height: 1.5; }
      .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 50px;
        padding: 0 24px;
        border-radius: 14px;
        background: var(--fill);
        color: var(--fg);
        font-size: 15.5px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: inset 0 0 0 0.5px var(--hair);
        transition: filter 0.15s ease, transform 0.15s ease;
      }
      a.button.primary { background: #0a84ff; color: #fff; box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 8px 24px rgba(10, 132, 255, 0.35); }
      a.button:hover { filter: brightness(1.08); }
      a.button:active { transform: scale(0.98); }
      .foot { margin-top: 36px; font-size: 12.5px; color: var(--fg2); opacity: 0.8; }
      .foot a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="wall" aria-hidden="true"><span></span><span></span></div>
    <main>
      <img src="/icon.png" alt="" />
      <h1>Infimeety</h1>
      <p>Voice rooms, chat, meetings and watch-together with your friends. No time limits. Ever.</p>
      <div class="buttons">
        <a class="button primary" href="/download">Download for Windows &amp; Mac</a>
        <a class="button" href="/web/">Open in your browser</a>
      </div>
      <p class="foot"><a href="/privacy">Privacy</a></p>
    </main>
  </body>
</html>
