<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infimeety</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      :root { --bg: #08080c; color-scheme: dark; }
      @media (prefers-color-scheme: light) { :root { --bg: #e9ebf1; color-scheme: light; } }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI Variable Display', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        padding: 0 24px;
        border-radius: 14px;
        background: #0a84ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 8px 24px rgba(10, 132, 255, 0.35);
        transition: filter 0.15s ease, transform 0.15s ease;
      }
      .button:hover { filter: brightness(1.1); }
      .button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <a class="button" href="https://github.com/teamcreatovert/infimeety/releases/latest">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.1 10.4 4v7.2H3zm8.3-1.2L21 2.5v8.7h-9.7zM3 12.8h7.4V20L3 18.9zm8.3 0H21v8.7l-9.7-1.4z" /></svg>
      Download Infimeety for Windows
    </a>
  </body>
</html>
