name: Mobile

# Builds the phone apps (docs/MOBILE.md).
#
# Android: Infimeety.apk, which anyone can install. It's signed with the Infimeety Android key
# once that's saved as a secret (ANDROID_KEYSTORE + ANDROID_KEYSTORE_PASSWORD). Without it the
# build is signed with a throwaway key: it installs and runs, but each new build has to replace
# the old one by uninstalling it first.
#
# iPhone: a build for the iOS Simulator, which proves the app compiles. Installing on real
# iPhones (TestFlight, the App Store) needs an Apple Developer account first.
#
# Runs on pushes to branches that change the app, and from Actions → Mobile → Run workflow.
# While Android is paused, releases don't call it (see release.yml).
on:
  push:
    branches-ignore: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: Name for the APK's artifact
        type: string
        default: Infimeety-android
      ios:
        description: Also check the iPhone build
        type: boolean
        default: true
      require-key:
        description: Fail instead of signing with a throwaway key (releases)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: mobile-android-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Real phones are arm64 (nearly all) or older 32-bit arm.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REQUIRE_KEY: ${{ inputs.require-key || false }}
        run: |
          store="$RUNNER_TEMP/infimeety.jks"
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 --decode > "$store"
            password="$KEYSTORE_PASSWORD"
          elif [[ "$REQUIRE_KEY" == true ]]; then
            echo "::error::A release APK needs the Infimeety Android key (ANDROID_KEYSTORE). See docs/MOBILE.md."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE secret, so this APK is signed with a throwaway key. See docs/MOBILE.md."
            password=throwaway
            keytool -genkeypair -keystore "$store" -alias infimeety -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$password" -keypass "$password" -dname "CN=Infimeety test build"
          fi
          printf 'storeFile=%s\npassword=%s\nkeyAlias=infimeety\n' "$store" "$password" > app/src-tauri/gen/android/keystore.properties

      # The runner comes with the Android SDK and NDK; the NDK is installed if it's missing.
      - name: Build
        working-directory: app
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2> /dev/null | "$sdkmanager" --licenses > /dev/null || true
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            "$sdkmanager" --install "ndk;27.2.12479018" > /dev/null
            ndk="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          export NDK_HOME="$ndk"
          echo "NDK: $NDK_HOME"
          npx tauri android build --apk --target aarch64 --target armv7 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          [[ -n "$apk" ]] || { echo "::error::No APK was built."; exit 1; }
          cp "$apk" "$RUNNER_TEMP/Infimeety.apk"
          ls -l "$RUNNER_TEMP/Infimeety.apk"

      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact || 'Infimeety-android' }}
          path: ${{ runner.temp }}/Infimeety.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    # On a push or a manual run `inputs.ios` is missing, and a missing value equals false in
    # these expressions; its JSON text is 'null' then, so only an explicit `ios: false` skips.
    if: ${{ toJSON(inputs.ios) != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: mobile-ios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Install app dependencies
        working-directory: app
        run: |
          npm ci
          command -v xcodegen > /dev/null || brew install xcodegen

      # The Xcode project is made fresh each time (it isn't kept in git); then the phone icons go in.
      - name: Make the Xcode project
        working-directory: app
        run: |
          npx tauri ios init --ci
          npx tauri icon src-tauri/icons/mobile/icons.json

      # --no-sign: signing needs an Apple developer team, which a Simulator build doesn't. Tauri
      # then archives without code signing and copies the .app out for the Simulator.
      - name: Build for the Simulator
        working-directory: app
        run: npx tauri ios build --target aarch64-sim --no-sign --ci
