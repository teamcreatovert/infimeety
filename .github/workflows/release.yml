name: Release

# Builds the Windows installer, the Mac app and the Linux app, code-signs the Windows one through SignPath
# once that is set up (docs/CODE-SIGNING.md), signs both for the updater and publishes one
# GitHub release + the latest.json that installed apps auto-update from.
#
# Start it by pushing a version tag (git tag v0.2.0 && git push origin v0.2.0), or from
# Actions → Release → Run workflow, which also takes release notes and a dry-run switch.
#
# Windows order matters: infimeety.exe is signed before it's packed into the installer, the
# installer is signed next, and the updater signature (.sig) is made last, over the final
# bytes. Changing a file after its .sig is made breaks updates for everyone. The Mac build
# does all of that itself (tauri build signs the app, then makes and signs the update).
#
# A failed Mac build doesn't hold back Windows: the release goes out with what was built.
# Android is paused (no signing key yet); publish-release.mjs adds an APK if one is there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (shown in the in-app update card)
        required: false
        default: ''
      dry-run:
        description: Build and sign only. Keep the builds as workflow artifacts, publish nothing.
        type: boolean
        default: false

permissions:
  contents: write # create the release
  actions: read # SignPath reads this run's artifacts

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ inputs.dry-run || false }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: version
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version in tauri.conf.json."
            exit 1
          fi
          if [[ "$DRY_RUN" != true ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::$tag is already released. Bump the version first."
              exit 1
            fi
            if [[ "$SIGN" == true && "$SIGNING_POLICY" == test-signing ]]; then
              echo "::error::Test-signed builds can't be published. Use a dry run, or switch SIGNPATH_SIGNING_POLICY_SLUG to release-signing."
              exit 1
            fi
          fi
          if [[ "$HAS_UPDATER_KEY" != true ]]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (contents of ~/.tauri/infimeety.key). See docs/SETUP.md §7."
            exit 1
          fi
          if [[ "$SIGN" != true ]]; then
            echo "::warning::SignPath isn't set up, so the Windows installer is NOT code-signed. See docs/CODE-SIGNING.md."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    # A signing request waits for you to approve it in SignPath, up to two hours each.
    timeout-minutes: 300
    outputs:
      signed: ${{ steps.authenticode.outputs.signed }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      INSTALLER: src-tauri/target/release/bundle/nsis/Infimeety_${{ needs.check.outputs.version }}_x64-setup.exe
      # Signing turns on once the SignPath organization id is saved as a repository variable.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      # The .sig is made by hand after code signing, so the bundler must not make a stale one.
      NO_UPDATER_ARTIFACTS: '{"bundle":{"createUpdaterArtifacts":false}}'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # Compiles infimeety.exe and stamps it with its bundle type (nsis). The installer this
      # makes is only a by-product when signing is on: it's rebuilt around the signed exe.
      - name: Build
        working-directory: app
        run: npx tauri build --bundles nsis --ci --config "$NO_UPDATER_ARTIFACTS"

      - name: Upload infimeety.exe for signing
        id: unsigned-exe
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: app/src-tauri/target/release/infimeety.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign infimeety.exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'infimeety' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/exe

      # --no-binary-patching: the exe was already stamped by the first build, and patching it
      # again would rewrite it and break its signature.
      - name: Rebuild the installer around the signed exe
        if: env.SIGN == 'true'
        working-directory: app
        run: |
          cp ../signed/exe/infimeety.exe src-tauri/target/release/infimeety.exe
          npx tauri bundle --bundles nsis --ci --no-binary-patching --config "$NO_UPDATER_ARTIFACTS"

      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: app/${{ env.INSTALLER }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'infimeety' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installer

      - name: Check the signatures
        if: env.SIGN == 'true'
        working-directory: app
        shell: pwsh
        run: |
          Copy-Item "../signed/installer/$(Split-Path $env:INSTALLER -Leaf)" $env:INSTALLER -Force
          # The test-signing certificate isn't trusted by Windows, so only release builds must be Valid.
          $allowed = if ($env:SIGNING_POLICY -eq 'test-signing') { 'Valid', 'UnknownError', 'NotTrusted' } else { 'Valid' }
          foreach ($file in 'src-tauri/target/release/infimeety.exe', $env:INSTALLER) {
            $sig = Get-AuthenticodeSignature $file
            "{0}: {1} ({2})" -f $file, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -notin $allowed) { throw "$file is not properly signed: $($sig.StatusMessage)" }
          }

      - name: Sign for the updater
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign --app-version "$VERSION" "$INSTALLER"

      # The release page links the code signing policy only when the installer really is signed.
      - name: Read the code signature
        id: authenticode
        working-directory: app
        shell: pwsh
        run: |
          $status = (Get-AuthenticodeSignature -LiteralPath $env:INSTALLER).Status
          "Installer signature: $status"
          "signed=$(if ($status -eq 'Valid') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: Infimeety-${{ env.VERSION }}-windows
          path: |
            app/${{ env.INSTALLER }}
            app/${{ env.INSTALLER }}.sig
          if-no-files-found: error
          retention-days: 7

  # The Mac app (mac.yml): GitHub's Intel Macs first, then its Apple Silicon ones if that
  # build fails or never starts. Either kind builds the universal app.
  macos:
    needs: check
    uses: ./.github/workflows/mac.yml
    with:
      runner: macos-15-intel
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  macos-retry:
    needs: [check, macos]
    if: ${{ !cancelled() && needs.macos.outputs.built != 'true' }}
    uses: ./.github/workflows/mac.yml
    with:
      runner: macos-latest
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  # The Linux app (linux.yml): an AppImage that updates itself, and a .deb.
  linux:
    needs: check
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  # Android is paused: releases don't build it. To bring it back, add the ANDROID_KEYSTORE
  # secrets (docs/MOBILE.md) and an `android` job calling mobile.yml with require-key: true,
  # and list it under publish's needs.

  publish:
    needs: [check, windows, macos, macos-retry, linux]
    # Windows must have built; the Mac and Linux apps join the release if they built too.
    if: ${{ !cancelled() && needs.windows.result == 'success' && inputs.dry-run != true }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          pattern: Infimeety-${{ needs.check.outputs.version }}-*
          path: release-assets

      - name: Note a missing Mac build
        if: needs.macos.outputs.built != 'true' && needs.macos-retry.outputs.built != 'true'
        run: echo "::warning::The Mac build failed, so this release is Windows-only. Mac users keep their current version."

      - name: Note a missing Linux build
        if: needs.linux.outputs.built != 'true'
        run: echo "::warning::The Linux build failed, so this release has no Linux app. Linux users keep their current version."

      - name: Publish the release
        env:
          NOTES: ${{ inputs.notes }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: node app/scripts/publish-release.mjs "${NOTES:-A fresh update for Infimeety. Open the app and click \"Update & restart\".}" --assets release-assets
